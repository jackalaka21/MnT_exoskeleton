; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
test_framework = unity
upload_protocol = teensy-cli
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.9
    discord-intech/FreeRTOS-Teensy4
    https://github.com/tonton81/FlexCAN_T4.git

; Standalone CAN motor bench test — upload like a normal sketch.
; Select env "test_motor_can" in VS Code, then click Upload.
[env:test_motor_can]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_src_filter = -<*> +<MotorController.cpp> +<test_motor_can.cpp>
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
