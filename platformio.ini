; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
test_framework = unity
upload_protocol = teensy-cli
; Exclude the standalone test sketches (each has its own setup()/loop()) from the main firmware.
build_src_filter = +<*> -<fsr_align_test.cpp> -<can_diag_test.cpp>
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.9
    discord-intech/FreeRTOS-Teensy4

; Standalone FSR channel-mapping test — build/flash with:  pio run -e teensy41_fsr -t upload
; Compiles ONLY the test sketch + FSR driver (no FreeRTOS / IMU / motors).
[env:teensy41_fsr]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_src_filter = -<*> +<fsr_align_test.cpp> +<FSR.cpp>

; Standalone CAN bus diagnostic — build/flash with:  pio run -e teensy41_can -t upload
; Compiles ONLY the diagnostic sketch + MotorCAN driver (no FreeRTOS / IMU / control).
[env:teensy41_can]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_src_filter = -<*> +<can_diag_test.cpp> +<MotorCAN.cpp>
